name: Test Suite

on:
  pull_request:
    branches: [main, dev, dev_trending_projects]
  push:
    branches: [main, dev, dev_trending_projects]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      GOOGLE_PRIVATE_KEY: eyJjbGllbnRfZW1haWwiOiJ0ZXN0QGV4YW1wbGUuY29tIn0=
      GOOGLE_CLOUD_BUCKET: dummy-bucket
      WEBHOOK_SECRET: dummy
      REPLICATE_API_TOKEN: dummy
      GEMINI_API_KEY: dummy
      NEXT_PUBLIC_POSTHOG_KEY: dummy
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      SITE_URL: https://example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Check for circular dependencies
        run: npm run check:cycles

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for vulnerabilities
        run: npx audit-ci --moderate
